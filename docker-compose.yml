name: django-commerce
#version: "3.8"

services:
  inventory_db:
    image: postgres:15.14-alpine3.21
    env_file:
      - ./.env
    ports: 
      - "5432:5432" 
    volumes:
      - ./postgres/scripts:/docker-entrypoint-initdb.d

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"      
  web:
   build: .
   command: python manage.py runserver 0.0.0.0:8000  
   volumes:
     - .:/code
   ports:
     - "8000:8000"
   depends_on:
      - inventory_db

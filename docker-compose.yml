name: django-commerce
#version: "3.8"

services:
  inventory_db:
    image: pgvector/pgvector:pg15-trixie
    container_name: inventory_db
    env_file:
      - ./.env
    ports: 
      - "5432:5432" 
    volumes:
      - ./postgres/scripts:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"      
